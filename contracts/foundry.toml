[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

# Monad Testnet RPC is passed explicitly to deploy commands via --rpc-url
# (kept out of the default profile so `forge test` stays local/offline).

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
